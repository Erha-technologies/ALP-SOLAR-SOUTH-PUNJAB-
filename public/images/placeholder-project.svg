<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Solar panel array illustration">
  <rect width="480" height="320" fill="#F7F9FA"/>
  <rect x="0" y="220" width="480" height="100" fill="#EAF2F5"/>
  <g stroke="#C6A56E" stroke-width="1" stroke-dasharray="2 4" opacity="0.6">
    <line x1="0" y1="220" x2="480" y2="220"/>
  </g>
  <!-- roofline -->
  <polygon points="40,220 240,120 440,220" fill="#004F6B" opacity="0.06"/>
  <polyline points="40,220 240,120 440,220" fill="none" stroke="#004F6B" stroke-width="2"/>
  <!-- panel grid -->
  <g>
    <rect x="110" y="168" width="220" height="44" rx="2" fill="#FFFFFF" stroke="#004F6B" stroke-width="1.5"/>
    <line x1="165" y1="168" x2="165" y2="212" stroke="#004F6B" stroke-width="1"/>
    <line x1="220" y1="168" x2="220" y2="212" stroke="#004F6B" stroke-width="1"/>
    <line x1="275" y1="168" x2="275" y2="212" stroke="#004F6B" stroke-width="1"/>
    <line x1="110" y1="190" x2="330" y2="190" stroke="#004F6B" stroke-width="1"/>
  </g>
  <!-- callout annotation -->
  <line x1="330" y1="180" x2="380" y2="150" stroke="#C6A56E" stroke-width="1"/>
  <circle cx="330" cy="180" r="2.5" fill="#C6A56E"/>
  <text x="386" y="153" font-family="monospace" font-size="11" fill="#667085">PV ARRAY</text>
  <line x1="140" y1="212" x2="120" y2="250" stroke="#C6A56E" stroke-width="1"/>
  <circle cx="140" cy="212" r="2.5" fill="#C6A56E"/>
  <text x="70" y="264" font-family="monospace" font-size="11" fill="#667085">MOUNT</text>
</svg>
